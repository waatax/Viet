    <script>
      // Single Page Apps for GitHub Pages
      // Redirect to base path with path query/hash
      const pathSegments = window.location.pathname.replace(/^\/Viet\/?/, '').split('/');
      const search = window.location.search;
      const hash = window.location.hash;
      const targetHash = pathSegments[0] ? `#/${pathSegments[0]}` : hash;
      window.location.replace('/Viet/' + (targetHash ? targetHash : ''));
    </script>
